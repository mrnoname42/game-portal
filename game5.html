<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Clicker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        panelBg: '#121826',
                        accentCyan: '#06b6d4',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.4)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.6)); }
        }
        .quantum-orb {
            animation: pulse-slow 4s infinite ease-in-out;
        }
        .float-text {
            animation: floatUp 0.8s forwards ease-out;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121826;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans select-none flex flex-col">

    <!-- Header -->
    <header class="bg-panelBg/80 backdrop-blur border-b border-gray-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-atom text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wider bg-gradient-to-r from-cyan-400 to-purple-400 bg-clip-text text-transparent">QUANTUM CLICKER</h1>
                <p class="text-xs text-gray-400">Harness the subatomic energy</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="resetGame()" class="text-xs px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-red-900/40 text-gray-400 hover:text-red-400 border border-gray-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Stats & Clicker Core -->
        <section class="lg:col-span-5 flex flex-col items-center justify-between bg-panelBg/50 border border-gray-800/80 rounded-2xl p-6 shadow-xl relative overflow-hidden">
            <!-- Background glow -->
            <div class="absolute -top-24 -left-24 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -right-24 w-64 h-64 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Score Display -->
            <div class="text-center z-10 w-full mb-6">
                <h2 class="text-xs uppercase tracking-widest text-gray-400 font-semibold mb-1">Quantum Energy</h2>
                <div id="energyDisplay" class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-purple-400 tracking-tight">0</div>
                <div class="flex justify-center gap-6 mt-2 text-xs text-gray-400">
                    <div>Per Click: <span id="clickPowerDisplay" class="text-cyan-400 font-semibold">1</span></div>
                    <div>Per Second: <span id="cpsDisplay" class="text-purple-400 font-semibold">0</span></div>
                </div>
            </div>

            <!-- Clicker Button Orb -->
            <div class="relative flex items-center justify-center my-8 z-10">
                <!-- Ripple container for click effects -->
                <div id="clickContainer" class="absolute inset-0 pointer-events-none"></div>
                
                <button id="clickBtn" onclick="onCoreClick(event)" class="quantum-orb w-48 h-48 md:w-56 md:h-56 rounded-full bg-gradient-to-tr from-cyan-600 via-teal-500 to-purple-600 p-1 shadow-2xl focus:outline-none transform active:scale-95 transition cursor-pointer group">
                    <div class="w-full h-full rounded-full bg-darkBg flex flex-col items-center justify-center relative overflow-hidden group-hover:bg-opacity-90 transition">
                        <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/20 to-purple-500/20 opacity-50 group-hover:opacity-80 transition"></div>
                        <i class="fa-solid fa-atom text-5xl md:text-6xl text-cyan-400 drop-shadow-[0_0_10px_rgba(6,182,212,0.8)] mb-2 group-hover:rotate-45 transition duration-500"></i>
                        <span class="text-xs font-bold uppercase tracking-widest text-cyan-200 z-10">Harvest</span>
                    </div>
                </button>
            </div>

            <!-- Stats Mini Bar -->
            <div class="grid grid-cols-2 gap-4 w-full z-10 mt-4">
                <div class="bg-gray-900/60 border border-gray-800 rounded-xl p-3 text-center">
                    <div class="text-[10px] text-gray-400 uppercase tracking-wider">Total Harvested</div>
                    <div id="totalEarnedDisplay" class="text-lg font-bold text-gray-200">0</div>
                </div>
                <div class="bg-gray-900/60 border border-gray-800 rounded-xl p-3 text-center">
                    <div class="text-[10px] text-gray-400 uppercase tracking-wider">Time Played</div>
                    <div id="timePlayedDisplay" class="text-lg font-bold text-gray-200">0s</div>
                </div>
            </div>
        </section>

        <!-- Right Column: Shop & Upgrades -->
        <section class="lg:col-span-7 flex flex-col bg-panelBg/50 border border-gray-800/80 rounded-2xl p-6 shadow-xl h-[600px] lg:h-auto overflow-hidden">
            
            <!-- Tabs -->
            <div class="flex border-b border-gray-800 pb-3 mb-4 space-x-2">
                <button onclick="switchTab('upgrades')" id="tab-upgrades" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition">
                    <i class="fa-solid fa-store mr-1.5"></i> Upgrades
                </button>
                <button onclick="switchTab('achievements')" id="tab-achievements" class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-gray-900 text-gray-400 border border-gray-800 hover:text-gray-200 transition">
                    <i class="fa-solid fa-trophy mr-1.5"></i> Achievements <span id="achievementBadge" class="ml-1 px-1.5 py-0.5 rounded-full bg-purple-500/30 text-purple-300 text-[10px]">0/6</span>
                </button>
            </div>

            <!-- Tab Content: Upgrades -->
            <div id="content-upgrades" class="flex-1 overflow-y-auto pr-1 space-y-3">
                <!-- Upgrades generated via JS -->
            </div>

            <!-- Tab Content: Achievements -->
            <div id="content-achievements" class="flex-1 overflow-y-auto pr-1 space-y-3 hidden">
                <!-- Achievements generated via JS -->
            </div>
        </section>

    </main>

    <!-- Custom Notification Toast -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- JavaScript Game Logic -->
    <script>
        // Game State
        let game = {
            energy: 0,
            totalEarned: 0,
            clickPower: 1,
            cps: 0,
            timePlayed: 0,
            upgrades: {
                cursor: { name: "Nano Drone", cost: 15, cps: 0.5, count: 0, type: "cps", icon: "fa-robot", desc: "A micro drone collecting random ambient energy." },
                amplifier: { name: "Energy Catalyst", cost: 100, clickBoost: 1, count: 0, type: "click", icon: "fa-bolt", desc: "Enhances manual tapping core efficiency." },
                generator: { name: "Quantum Reactor", cost: 1100, cps: 8, count: 0, type: "cps", icon: "fa-industry", desc: "Stable core fusion producing steady quantum flux." },
                collider: { name: "Particle Collider", cost: 13000, cps: 47, count: 0, type: "cps", icon: "fa-circle-nodes", desc: "Smashes high-speed ions for massive yields." },
                gateway: { name: "Dimension Rift", cost: 130000, cps: 260, count: 0, type: "cps", icon: "fa-portal-enter", desc: "Taps directly into alternate dimensions." }
            },
            achievements: {
                firstClick: { name: "First Spark", desc: "Harvest your first quantum energy.", target: 1, unlocked: false, icon: "fa-sparkles" },
                novice: { name: "Energy Gatherer", desc: "Reach a total of 1,000 harvested energy.", target: 1000, unlocked: false, icon: "fa-battery-half" },
                industrial: { name: "Reactor Online", desc: "Own at least 5 Quantum Reactors.", target: 5, unlocked: false, icon: "fa-industry", check: () => game.upgrades.generator.count >= 5 },
                millionaire: { name: "Quantum Tycoon", desc: "Accumulate 100,000 total energy.", target: 100000, unlocked: false, icon: "fa-gem" },
                multiversal: { name: "Master of Dimensions", desc: "Own at least 3 Dimension Rifts.", target: 3, unlocked: false, icon: "fa-globe", check: () => game.upgrades.gateway.count >= 3 },
                dedicated: { name: "Time Traveler", desc: "Play for at least 60 seconds.", target: 60, unlocked: false, icon: "fa-clock", check: () => game.timePlayed >= 60 }
            }
        };

        // Format numbers cleanly
        function formatNum(num) {
            if (num < 1000) return Math.floor(num * 10) / 10 === Math.floor(num) ? Math.floor(num) : num.toFixed(1);
            const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
            const i = Math.floor(Math.log10(num) / 3);
            return `${(num / Math.pow(10, i * 3)).toFixed(2)} ${suffixes[i]}`;
        }

        // Initialize Upgrades HTML
        function renderUpgrades() {
            const container = document.getElementById('content-upgrades');
            container.innerHTML = '';

            for (let key in game.upgrades) {
                const up = game.upgrades[key];
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border border-gray-800 bg-gray-900/50 flex items-center justify-between transition hover:border-gray-700`;
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-lg bg-gray-800 flex items-center justify-center text-cyan-400 text-lg shadow-inner">
                            <i class="fa-solid ${up.icon}"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-sm text-gray-200">${up.name}</h4>
                                <span class="text-xs px-2 py-0.5 rounded-md bg-gray-800 text-cyan-400 font-bold" id="count-${key}">${up.count}</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5">${up.desc}</p>
                        </div>
                    </div>
                    <button onclick="buyUpgrade('${key}')" id="buy-${key}" class="px-4 py-2 rounded-lg bg-gradient-to-r from-cyan-600 to-teal-600 hover:from-cyan-500 hover:to-teal-500 text-white text-xs font-bold shadow-md transition disabled:opacity-40 disabled:cursor-not-allowed flex flex-col items-center min-w-[90px]">
                        <span>Buy</span>
                        <span class="text-[10px] opacity-90 font-normal" id="cost-${key}">${formatNum(up.cost)}</span>
                    </button>
                `;
                container.appendChild(card);
            }
        }

        // Initialize Achievements HTML
        function renderAchievements() {
            const container = document.getElementById('content-achievements');
            container.innerHTML = '';

            for (let key in game.achievements) {
                const ach = game.achievements[key];
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border flex items-center space-x-3 transition ${ach.unlocked ? 'bg-purple-950/20 border-purple-800/50' : 'bg-gray-900/30 border-gray-800 opacity-60'}`;
                
                card.innerHTML = `
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center text-xl ${ach.unlocked ? 'bg-purple-900/40 text-purple-300' : 'bg-gray-800 text-gray-500'}">
                        <i class="fa-solid ${ach.icon}"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between">
                            <h4 class="font-bold text-sm ${ach.unlocked ? 'text-purple-300' : 'text-gray-300'}">${ach.name}</h4>
                            ${ach.unlocked ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 font-semibold">Unlocked</span>' : '<span class="text-[10px] text-gray-500">Locked</span>'}
                        </div>
                        <p class="text-xs text-gray-400 mt-0.5">${ach.desc}</p>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // Tab Switching
        function switchTab(tab) {
            const upgradesTab = document.getElementById('tab-upgrades');
            const achievementsTab = document.getElementById('tab-achievements');
            const upgradesContent = document.getElementById('content-upgrades');
            const achievementsContent = document.getElementById('content-achievements');

            if (tab === 'upgrades') {
                upgradesTab.className = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 transition";
                achievementsTab.className = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-gray-900 text-gray-400 border border-gray-800 hover:text-gray-200 transition";
                upgradesContent.classList.remove('hidden');
                achievementsContent.classList.add('hidden');
            } else {
                achievementsTab.className = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-purple-500/20 text-purple-400 border border-purple-500/30 transition";
                upgradesTab.className = "px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-gray-900 text-gray-400 border border-gray-800 hover:text-gray-200 transition";
                achievementsContent.classList.remove('hidden');
                upgradesContent.classList.add('hidden');
            }
        }

        // Click Action
        function onCoreClick(event) {
            game.energy += game.clickPower;
            game.totalEarned += game.clickPower;
            
            // Visual floating text effect
            createFloatingText(event, `+${formatNum(game.clickPower)}`);
            updateUI();
            checkAchievements();
        }

        // Floating click numbers
        function createFloatingText(e, text) {
            const container = document.getElementById('clickContainer');
            const rect = container.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

            const el = document.createElement('div');
            el.className = "absolute text-cyan-300 font-black text-sm float-text pointer-events-none select-none";
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.innerText = text;

            container.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Buy Upgrade logic
        function buyUpgrade(key) {
            const up = game.upgrades[key];
            if (game.energy >= up.cost) {
                game.energy -= up.cost;
                up.count++;
                up.cost = Math.floor(up.cost * 1.15); // standard idle game scaling cost

                // Apply upgrade effects
                recalculateStats();
                updateUI();
                renderUpgrades();
            }
        }

        // Recalculate CPS and Click Power
        function recalculateStats() {
            let totalCps = 0;
            let baseClick = 1;

            for (let key in game.upgrades) {
                const up = game.upgrades[key];
                if (up.type === 'cps') {
                    totalCps += up.cps * up.count;
                } else if (up.type === 'click') {
                    baseClick += (up.clickBoost * up.count);
                }
            }

            game.cps = totalCps;
            game.clickPower = baseClick;
        }

        // Check Achievements Progress
        function checkAchievements() {
            let unlockedCount = 0;
            for (let key in game.achievements) {
                const ach = game.achievements[key];
                if (!ach.unlocked) {
                    let conditionMet = false;
                    if (ach.check) {
                        conditionMet = ach.check();
                    } else if (key === 'firstClick') {
                        conditionMet = game.totalEarned >= 1;
                    } else if (key === 'novice') {
                        conditionMet = game.totalEarned >= 1000;
                    } else if (key === 'millionaire') {
                        conditionMet = game.totalEarned >= 100000;
                    }

                    if (conditionMet) {
                        ach.unlocked = true;
                        showToast(`Achievement Unlocked: ${ach.name}`);
                    }
                }
                if (ach.unlocked) unlockedCount++;
            }
            document.getElementById('achievementBadge').innerText = `${unlockedCount}/6`;
            renderAchievements();
        }

        // Toast Notification System
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = "bg-panelBg border border-purple-500/40 text-purple-200 px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto";
            toast.innerHTML = `
                <div class="text-purple-400 text-lg"><i class="fa-solid fa-trophy"></i></div>
                <div>
                    <div class="text-[10px] uppercase font-bold text-purple-400 tracking-widest">Achievement Unlocked</div>
                    <div class="text-xs font-semibold text-gray-200">${message.replace('Achievement Unlocked: ', '')}</div>
                </div>
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Main Update UI loop
        function updateUI() {
            document.getElementById('energyDisplay').innerText = formatNum(game.energy);
            document.getElementById('clickPowerDisplay').innerText = formatNum(game.clickPower);
            document.getElementById('cpsDisplay').innerText = formatNum(game.cps);
            document.getElementById('totalEarnedDisplay').innerText = formatNum(game.totalEarned);
            document.getElementById('timePlayedDisplay').innerText = `${game.timePlayed}s`;

            // Update button states
            for (let key in game.upgrades) {
                const up = game.upgrades[key];
                const btn = document.getElementById(`buy-${key}`);
                const countEl = document.getElementById(`count-${key}`);
                if (btn && countEl) {
                    countEl.innerText = up.count;
                    if (game.energy >= up.cost) {
                        btn.removeAttribute('disabled');
                    } else {
                        btn.setAttribute('disabled', 'true');
                    }
                }
            }
        }

        // Reset Game Data
        function resetGame() {
            if (confirm("Are you sure you want to reset your quantum progress?")) {
                localStorage.removeItem('quantumClickerSave');
                location.reload();
            }
        }

        // Save & Load System
        function saveGame() {
            localStorage.setItem('quantumClickerSave', JSON.stringify(game));
        }

        function loadGame() {
            const saved = localStorage.getItem('quantumClickerSave');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    game = { ...game, ...parsed };
                    recalculateStats();
                } catch (e) {
                    console.error("Failed to load save data", e);
                }
            }
        }

        // Game Loop (Ticks every 100ms for smooth increments, 1s for stats)
        let lastTick = Date.now();
        function gameLoop() {
            const now = Date.now();
            const delta = (now - lastTick) / 1000;
            lastTick = now;

            if (game.cps > 0) {
                const earned = game.cps * delta;
                game.energy += earned;
                game.totalEarned += earned;
            }

            updateUI();
            checkAchievements();
        }

        // Time Counter Loop (1 second intervals)
        setInterval(() => {
            game.timePlayed++;
            saveGame();
        }, 1000);

        // Fast Tick Loop
        setInterval(gameLoop, 100);

        // Initialization
        window.onload = function() {
            loadGame();
            recalculateStats();
            renderUpgrades();
            renderAchievements();
            updateUI();
        };
    </script>
</body>
</html>
