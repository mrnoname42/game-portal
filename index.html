<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-hover: rgba(51, 65, 85, 0.9);
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-color) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
        }

        .game-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            background: var(--card-hover);
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 25px -5px var(--accent-glow);
        }

        .game-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .game-card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Arcade Portal</h1>
        <p class="subtitle">Choose a game below and jump straight into the action!</p>
    </header>

    <div class="game-list" id="game-list">
        <div class="status-message" id="loading-text">Loading your games database...</div>
    </div>
    <script>
        // Adding a timestamp query (?t=...) forces the browser to bypass the cache
        fetch('games.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(games => {
                const gameListContainer = document.getElementById('game-list');
                gameListContainer.innerHTML = ''; 

                games.forEach(game => {
                    const card = document.createElement('a');
                    card.href = `game-loader.html?game=${game.file}`;
                    card.className = 'game-card';

                    const title = document.createElement('h2');
                    title.innerText = game.title;

                    const desc = document.createElement('p');
                    desc.innerText = game.description;

                    card.appendChild(title);
                    card.appendChild(desc);
                    gameListContainer.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error loading games:', error);
                document.getElementById('game-list').innerHTML = '<div class="status-message">⚠️ Could not load the games database. Please check your connection or JSON file.</div>';
            });
    </script>
    
</body>
</html>
