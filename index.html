<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #2c3e50; color: white; margin: 0; padding: 20px; }
        .game-list { display: flex; justify-content: center; gap: 20px; margin-top: 50px; flex-wrap: wrap; }
        .game-card { background: #34495e; padding: 20px; border-radius: 10px; text-decoration: none; color: white; transition: 0.3s; min-width: 180px; }
        .game-card:hover { background: #1abc9c; transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>Welcome to the Game Portal</h1>
    <p>Select a game to play!</p>

    <!-- The game list is empty at first, JavaScript will fill it -->
    <div class="game-list" id="game-list">
        <p id="loading-text">Loading games database...</p>
    </div>

    <script>
        // Fetch the JSON database file
        fetch('games.json')
            .then(response => response.json())
            .then(games => {
                const gameListContainer = document.getElementById('game-list');
                gameListContainer.innerHTML = ''; // Clear the loading text

                // Loop through each game in the JSON file
                games.forEach(game => {
                    // Create the link wrapper
                    const card = document.createElement('a');
                    card.href = `game-loader.html?game=${game.file}`;
                    card.className = 'game-card';

                    // Create the title
                    const title = document.createElement('h2');
                    title.innerText = game.title;

                    // Create the description
                    const desc = document.createElement('p');
                    desc.innerText = game.description;

                    // Put them together
                    card.appendChild(title);
                    card.appendChild(desc);
                    gameListContainer.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error loading games:', error);
                document.getElementById('game-list').innerHTML = '<p>Error loading games database.</p>';
            });
    </script>
</body>
</html>
